<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI招聘助手</title>
<style>
  :root{
    --primary:#4f46e5; --primary-dark:#4338ca; --bg:#f5f6fa; --card:#fff;
    --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; --green:#16a34a; --red:#dc2626; --amber:#d97706;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  .page{display:none;max-width:880px;margin:0 auto;padding:24px 20px 80px}
  .page.active{display:block}
  /* 导航 */
  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  .logo{font-weight:700;font-size:18px;color:var(--primary)}
  .nav-actions{display:flex;gap:10px}
  button{cursor:pointer;border:none;border-radius:8px;font-size:14px;padding:9px 16px;font-weight:500;transition:.15s}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
  .btn-sm{padding:6px 12px;font-size:13px}
  h1{font-size:22px;margin-bottom:8px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:24px}
  /* 卡片 */
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
  input[type=text]{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit}
  input[type=text]:focus{outline:none;border-color:var(--primary)}
  textarea{width:100%;min-height:120px;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:14px;font-family:inherit;resize:vertical}
  textarea:focus{outline:none;border-color:var(--primary)}
  .label{font-size:14px;font-weight:600;margin:12px 0 6px}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  /* 文件上传 */
  .upload-zone{border:2px dashed var(--border);border-radius:12px;padding:18px;text-align:center;cursor:pointer;color:var(--muted);transition:.15s;background:var(--card)}
  .upload-zone:hover{border-color:var(--primary);color:var(--primary)}
  .file-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;margin-top:8px;background:var(--card)}
  .fc-name{font-weight:500;font-size:14px;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  .fc-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fc-status{font-size:12px;color:var(--muted);white-space:nowrap}
  .fc-status.ok{color:var(--green)}
  .fc-status.err{color:var(--red)}
  /* 岗位卡片（工作台） */
  .job-card{display:flex;align-items:center;justify-content:space-between;padding:16px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--card);cursor:pointer;transition:.15s}
  .job-card:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(79,70,229,.08)}
  .job-name{font-weight:600;font-size:15px}
  .job-meta{font-size:12px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:48px 0}
  /* 历史批次 */
  .task-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--card);cursor:pointer}
  .task-item:hover{border-color:var(--primary)}
  .task-info .t-name{font-weight:600;font-size:14px}
  .task-info .t-meta{font-size:12px;color:var(--muted)}
  /* 结果列表 */
  .result-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .cand-card{padding:14px 16px;border:1px solid var(--border);border-radius:12px;margin-bottom:12px;background:var(--card);cursor:pointer;transition:.15s}
  .cand-card:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(79,70,229,.08)}
  .judge-bar{display:flex;align-items:center;gap:12px;border-left:4px solid var(--border);padding-left:10px}
  .judge-score{font-weight:700;font-size:18px}
  .judge-name{font-weight:600;font-size:15px}
  .judge-missing{font-size:12px;color:var(--red);margin-left:auto}
  .judge-comment{font-size:13px;color:var(--text);margin:8px 0 0 14px}
  .raw-preview{margin:10px 0 0 14px;padding:10px 12px;background:#f9fafb;border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--muted);white-space:pre-wrap;word-break:break-all;max-height:140px;overflow:hidden}
  .raw-preview img{max-width:100%;max-height:120px;display:block;border-radius:6px}
  .low-group{background:var(--card);border:1px dashed var(--border);border-radius:10px;padding:12px 16px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer}
  /* 详情 */
  .detail-score{display:flex;align-items:center;gap:20px;margin-bottom:16px}
  .big-score{font-size:48px;font-weight:700;color:var(--primary)}
  .gap-tag{display:inline-block;background:#fef2f2;color:var(--red);border-radius:6px;padding:3px 10px;font-size:13px;margin:3px 4px 3px 0}
  .ok-tag{display:inline-block;background:#f0fdf4;color:var(--green);border-radius:6px;padding:3px 10px;font-size:13px;margin:3px 4px 3px 0}
  .comment-box{background:#eef2ff;border-radius:10px;padding:14px;font-size:14px}
  .resume-box{background:#f9fafb;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:13px;white-space:pre-wrap;max-height:400px;overflow:auto}
  .loading{text-align:center;padding:40px;color:var(--primary)}
  .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* 弹窗 */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:14px;padding:24px;width:440px;max-width:92vw}
  .modal h3{margin-bottom:12px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:200;opacity:0;transition:.3s}
  .toast.show{opacity:1}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

<div class="nav">
  <div class="logo">AI招聘助手</div>
  <div class="nav-actions">
    <button class="btn-ghost btn-sm" onclick="openSettings()">⚙ 设置</button>
    <button class="btn-primary btn-sm" onclick="goNew()">+ 新建岗位</button>
  </div>
</div>

<!-- 页面1 工作台：岗位列表 -->
<div class="page active" id="page-home">
  <h1>工作台</h1>
  <p class="sub">按岗位管理筛选，点击岗位进入后粘贴简历、开始匹配。</p>
  <div id="job-list"></div>
</div>

<!-- 页面2 新建岗位 -->
<div class="page" id="page-new">
  <button class="btn-ghost btn-sm" onclick="goHome()" style="margin-bottom:16px">← 返回</button>
  <h1>新建岗位</h1>
  <div class="card">
    <div class="label">岗位名称</div>
    <input type="text" id="job-name" placeholder="例如：AIGC视频生成师 / 新媒体运营 / 数据分析师">
    <div class="label">岗位 JD</div>
    <textarea id="job-jd" placeholder="粘贴岗位 JD，例如：负责AI漫剧的抽卡、提示词生成、精修AI素材…"></textarea>
  </div>
  <button class="btn-primary" style="width:100%;padding:13px" onclick="createJob()">保存岗位</button>
</div>

<!-- 页面3 岗位详情：贴简历匹配 -->
<div class="page" id="page-job">
  <button class="btn-ghost btn-sm" onclick="goHome()" style="margin-bottom:16px">← 返回工作台</button>
  <h1 id="job-title" style="margin-bottom:2px">岗位</h1>
  <div class="sub" id="job-date" style="margin-bottom:16px"></div>

  <div class="card">
    <div class="label" style="margin-top:0">岗位 JD</div>
    <div class="resume-box" id="job-jd-view"></div>
  </div>

  <div class="card">
    <div class="label" style="margin-top:0">粘贴简历（Ctrl+V 直接粘贴文字或截图）</div>
    <textarea id="resume-input" placeholder="直接 Ctrl+V 粘贴简历文字或截图；多份文字用一行 ===== 分隔"></textarea>
    <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg" multiple style="display:none" onchange="handleFiles(this.files)">
    <div class="upload-zone" onclick="document.getElementById('file-input').click()">
      <div style="font-size:24px">📎</div>
      <div>点击上传简历文件（PDF / 图片，可多选）</div>
      <div class="hint" style="margin:0">每份文件 = 一位候选人，原样保留</div>
    </div>
    <div id="file-list"></div>
  </div>

  <button class="btn-primary" style="width:100%;padding:13px" onclick="startMatch()">开始匹配</button>

  <div class="label" id="history-label" style="display:none">历史筛选</div>
  <div id="history-list"></div>
</div>

<!-- 页面4 匹配结果 -->
<div class="page" id="page-results">
  <div class="result-head">
    <div>
      <button class="btn-ghost btn-sm" onclick="goBackToJob()" style="margin-bottom:8px">← 返回岗位</button>
      <h1 id="res-title" style="margin-bottom:0">匹配结果</h1>
    </div>
    <div class="sub" style="margin:0" id="res-count"></div>
  </div>
  <div id="result-list"></div>
</div>

<!-- 页面5 候选人详情 -->
<div class="page" id="page-detail">
  <button class="btn-ghost btn-sm" onclick="goResults()" style="margin-bottom:16px">← 返回列表</button>
  <div class="card">
    <div class="detail-score">
      <div class="big-score" id="d-score">--</div>
      <div>
        <h1 id="d-name" style="margin-bottom:4px">候选人</h1>
        <div id="d-cover" class="sub" style="margin:0"></div>
      </div>
    </div>
    <div class="label" style="margin-top:0">技能覆盖</div>
    <div id="d-covered"></div>
    <div class="label">技能缺口</div>
    <div id="d-missing"></div>
    <div class="label">AI 点评</div>
    <div class="comment-box" id="d-comment"></div>
    <div class="label">简历原样</div>
    <div class="resume-box" id="d-resume"></div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="modal-bg" id="modal-settings">
  <div class="modal">
    <h3>设置</h3>
    <div class="label" style="margin-top:0">代理地址（接 DeepSeek 用，可选）</div>
    <input type="text" id="proxy-input" placeholder="https://你的名字.workers.dev">
    <div class="label">DeepSeek API Key（直连用，可选）</div>
    <input type="text" id="key-input" placeholder="sk-…">
    <div class="hint">都不填则用内置演示模式打分。</div>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn-primary" style="flex:1" onclick="saveSettings()">保存</button>
      <button class="btn-ghost" onclick="closeSettings()">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id=>document.getElementById(id);

let state = { currentJobId:null, resumes:[], results:[], detailIndex:-1 };
let uploadedFiles = [];

/* ===== 岗位数据 ===== */
function loadJobs(){ return JSON.parse(localStorage.getItem('jobs')||'[]'); }
function saveJobs(jobs){ localStorage.setItem('jobs', JSON.stringify(jobs)); }
function getJob(id){ return loadJobs().find(j=>j.id===id); }
function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtDate(ts){
  const d = new Date(ts);
  const p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

/* ===== 工具 ===== */
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2500); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $('page-'+name).classList.add('active');
  window.scrollTo(0,0);
}
function goHome(){ renderJobs(); showPage('home'); }
function goNew(){ showPage('new'); }
function goResults(){ renderResults(); showPage('results'); }
function goBackToJob(){
  if(state.currentJobId) openJob(state.currentJobId);
  else goHome();
}

/* ===== 工作台：岗位列表 ===== */
function renderJobs(){
  const jobs = loadJobs().sort((a,b)=>b.createdAt-a.createdAt);
  const box = $('job-list');
  if(jobs.length===0){
    box.innerHTML = '<div class="empty">还没有岗位<br><br><button class="btn-primary" onclick="goNew()">+ 新建岗位</button></div>';
    return;
  }
  box.innerHTML = jobs.map(j=>{
    const n = j.batches ? j.batches.length : 0;
    return '<div class="job-card" onclick="openJob(\''+j.id+'\')">'+
      '<div class="task-info"><div class="job-name">'+escapeHtml(j.name)+'</div>'+
      '<div class="job-meta">'+fmtDate(j.createdAt)+' 创建 · '+n+' 次筛选</div></div>'+
      '<span class="hint" style="margin:0">进入 →</span></div>';
  }).join('');
}

/* ===== 新建岗位 ===== */
function createJob(){
  const name = $('job-name').value.trim();
  const jd = $('job-jd').value.trim();
  if(!name){ toast('请填写岗位名称'); return; }
  if(!jd){ toast('请粘贴岗位 JD'); return; }
  const job = { id:uid(), name, jd, createdAt:Date.now(), batches:[] };
  const jobs = loadJobs();
  jobs.unshift(job);
  saveJobs(jobs);
  $('job-name').value=''; $('job-jd').value='';
  openJob(job.id);
  toast('岗位已保存');
}

/* ===== 打开岗位（每次进入清空简历） ===== */
function openJob(id){
  const job = getJob(id);
  if(!job) return;
  state.currentJobId = id;
  // 每次进入不留存上一次的简历
  uploadedFiles = [];
  $('resume-input').value = '';
  if($('file-input')) $('file-input').value = '';
  renderFileList();
  $('job-title').textContent = job.name;
  $('job-date').textContent = '创建于 '+fmtDate(job.createdAt);
  $('job-jd-view').textContent = job.jd;
  renderHistory(job);
  showPage('job');
}

function renderHistory(job){
  const box = $('history-list');
  const batches = job.batches || [];
  if(batches.length===0){
    $('history-label').style.display = 'none';
    box.innerHTML = '';
    return;
  }
  $('history-label').style.display = 'block';
  box.innerHTML = batches.slice().reverse().map(b=>{
    const n = b.results ? b.results.length : 0;
    return '<div class="task-item" onclick="openBatch(\''+job.id+'\',\''+b.id+'\')">'+
      '<div class="task-info"><div class="t-name">'+fmtDate(b.createdAt)+' 的筛选</div>'+
      '<div class="t-meta">'+n+' 份简历</div></div></div>';
  }).join('');
}

function openBatch(jobId, batchId){
  const job = getJob(jobId);
  if(!job) return;
  const batch = (job.batches||[]).find(b=>b.id===batchId);
  if(!batch) return;
  state.currentJobId = jobId;
  state.results = batch.results || [];
  $('res-title').textContent = job.name;
  $('res-count').textContent = '共 '+state.results.length+' 份简历 · '+fmtDate(batch.createdAt);
  renderResults();
  showPage('results');
}

/* ===== 简历解析 ===== */
function parseResumes(text){
  return text.split(/=+\s*/).map(s=>s.trim()).filter(Boolean).map((r,i)=>{
    let name = '候选人'+(i+1);
    const m = r.match(/姓名[:：]\s*([^\n]+)/);
    if(m) name = m[1].trim();
    return { name, text:r };
  });
}

/* ===== 文件上传 / 粘贴截图 ===== */
async function handleFiles(files){
  if(!files || files.length===0) return;
  for(let i=0;i<files.length;i++){
    const f = files[i];
    const item = { name:f.name||'截图', size:f.size||0, type:f.type, text:'', dataUrl:'', status:'parsing' };
    uploadedFiles.push(item);
    renderFileList();
    try{
      item.dataUrl = await readFileAsDataUrl(f);
      const isPdf = f.name && f.name.toLowerCase().endsWith('.pdf');
      item.text = isPdf ? await extractPdfText(f) : await extractImageText(f);
      item.status = item.text.trim() ? 'ok' : 'empty';
    }catch(e){
      item.status = 'err';
    }
    renderFileList();
  }
}
function renderFileList(){
  const box = $('file-list');
  if(!uploadedFiles.length){ box.innerHTML=''; return; }
  box.innerHTML = uploadedFiles.map((f,i)=>{
    const icon = (f.name||'').toLowerCase().endsWith('.pdf') ? '📄' : '🖼️';
    let statusHtml = '';
    if(f.status==='parsing') statusHtml = '<span class="fc-status">解析中…</span>';
    else if(f.status==='ok') statusHtml = '<span class="fc-status ok">✓ 已就绪</span>';
    else if(f.status==='empty') statusHtml = '<span class="fc-status err">未识别到文字</span>';
    else statusHtml = '<span class="fc-status err">解析失败</span>';
    return '<div class="file-card">'+
      '<div class="fc-name"><span>'+icon+' '+escapeHtml(f.name)+'</span></div>'+
      statusHtml+
      '<button type="button" class="btn-ghost btn-sm" onclick="removeFile('+i+')">移除</button>'+
      '</div>';
  }).join('');
}
function removeFile(i){
  uploadedFiles.splice(i,1);
  renderFileList();
}
function readFileAsDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(new Error('read fail'));
    r.readAsDataURL(file);
  });
}
async function extractPdfText(file){
  const pdfjsLib = window['pdfjs-dist/build/pdf'];
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let text = '';
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    text += tc.items.map(it=>it.str).join(' ') + '\n';
  }
  return text;
}
async function extractImageText(file){
  const result = await Tesseract.recognize(file, 'chi_sim+eng');
  return result.data.text;
}

/* ===== 开始匹配 ===== */
async function startMatch(){
  const job = getJob(state.currentJobId);
  if(!job){ toast('岗位不存在'); return; }
  const pastedText = $('resume-input').value.trim();
  const resumes = [];
  uploadedFiles.forEach(f=>{
    if(!f.text.trim()) return;
    let name = (f.name||'截图').replace(/\.(pdf|png|jpe?g)$/i,'');
    const m = f.text.match(/姓名[:：]\s*([^\n]+)/);
    if(m) name = m[1].trim();
    resumes.push({ name, text:f.text, dataUrl:f.dataUrl, fileType:f.type });
  });
  parseResumes(pastedText).forEach(r=>resumes.push(r));
  if(resumes.length===0){ toast('请先粘贴或上传简历'); return; }

  state.resumes = resumes;
  $('res-title').textContent = job.name;
  $('res-count').textContent = '共 '+resumes.length+' 份简历';
  showPage('results');
  $('result-list').innerHTML = '<div class="loading"><div class="spinner"></div>AI 正在拆解 JD 并匹配…</div>';

  let results = null, mode = '演示';
  try{
    results = await callDeepSeek(job.jd, resumes);
    if(results) mode = 'DeepSeek';
  }catch(e){ results = null; }
  if(!results){ results = resumes.map(r=>mockScore(r, job.jd)); mode = '演示'; }

  state.results = results.map((r,i)=>{
    return {
      name: r.name || resumes[i]?.name || ('候选人'+(i+1)),
      score: Number(r.score)||0,
      covered: r.covered||[],
      missing: r.missing||[],
      comment: r.comment||'暂无点评',
      text: resumes[i]?.text || '',
      dataUrl: resumes[i]?.dataUrl || '',
      fileType: resumes[i]?.fileType || ''
    };
  }).sort((a,b)=>b.score-a.score);

  // 保存为新的筛选批次
  const batch = { id:uid(), createdAt:Date.now(), results: state.results };
  job.batches = job.batches || [];
  job.batches.push(batch);
  const jobs = loadJobs();
  const idx = jobs.findIndex(j=>j.id===job.id);
  if(idx>=0){ jobs[idx] = job; saveJobs(jobs); }

  renderResults();
  toast('匹配完成（'+mode+'模式）');
}

/* ===== 结果展示：判断条 + 原样内容 ===== */
function renderResults(){
  const list = state.results;
  const high = list.filter(r=>r.score>=60);
  const low = list.filter(r=>r.score<60);
  let html = '';
  high.forEach((r,i)=> html += candCard(r, i));
  if(low.length>0){
    html += '<div class="low-group" onclick="toggleLow(this)">低分候选人（'+low.length+'人）点击展开</div><div id="low-box" style="display:none">';
    low.forEach((r,i)=> html += candCard(r, high.length+i));
    html += '</div>';
  }
  $('result-list').innerHTML = html;
}
function scoreColor(score){
  return score>=80 ? 'var(--green)' : (score>=60 ? 'var(--amber)' : 'var(--red)');
}
function candCard(r, idx){
  const color = scoreColor(r.score);
  return '<div class="cand-card" onclick="openDetail('+idx+')">'+
    '<div class="judge-bar" style="border-left-color:'+color+'">'+
      '<span class="judge-score" style="color:'+color+'">'+r.score+'分</span>'+
      '<span class="judge-name">'+escapeHtml(r.name)+'</span>'+
      '<span class="judge-missing">'+(r.missing.length ? '缺：'+escapeHtml(r.missing.slice(0,3).join('、')) : '无明显缺口')+'</span>'+
    '</div>'+
    '<div class="judge-comment">'+escapeHtml(r.comment)+'</div>'+
    rawPreview(r)+
    '</div>';
}
function rawPreview(r){
  if(r.dataUrl){
    if(r.fileType === 'application/pdf'){
      return '<div class="raw-preview">📄 PDF 简历文件</div>';
    }
    return '<div class="raw-preview"><img src="'+r.dataUrl+'" alt="简历截图"></div>';
  }
  const txt = (r.text||'').trim();
  if(!txt) return '';
  return '<div class="raw-preview">'+escapeHtml(txt.slice(0,160))+(txt.length>160?'…':'')+'</div>';
}
function toggleLow(el){
  const box = $('low-box'); box.style.display = box.style.display==='none'?'block':'none';
  el.style.display='none';
}

/* ===== 详情 ===== */
function openDetail(idx){
  state.detailIndex = idx;
  const r = state.results[idx];
  $('d-score').textContent = r.score;
  $('d-score').style.color = scoreColor(r.score);
  $('d-name').textContent = r.name;
  $('d-cover').textContent = '技能覆盖 '+r.covered.length+' 项 · 匹配度 '+r.score+' 分';
  $('d-covered').innerHTML = r.covered.map(s=>'<span class="ok-tag">'+escapeHtml(s)+'</span>').join('') || '<span class="sub">无</span>';
  $('d-missing').innerHTML = r.missing.map(s=>'<span class="gap-tag">缺：'+escapeHtml(s)+'</span>').join('') || '<span class="sub">无明显缺口</span>';
  $('d-comment').textContent = r.comment;
  const resumeBox = $('d-resume');
  if(r.dataUrl){
    resumeBox.style.maxHeight = 'none';
    resumeBox.style.whiteSpace = 'normal';
    resumeBox.style.padding = '0';
    if(r.fileType === 'application/pdf'){
      resumeBox.innerHTML = '<iframe src="'+r.dataUrl+'" style="width:100%;height:420px;border:none;border-radius:8px"></iframe>';
    } else {
      resumeBox.innerHTML = '<img src="'+r.dataUrl+'" style="max-width:100%;display:block;border-radius:8px">';
    }
  } else {
    resumeBox.style.maxHeight = '400px';
    resumeBox.style.whiteSpace = 'pre-wrap';
    resumeBox.style.padding = '12px';
    resumeBox.textContent = r.text || '';
  }
  showPage('detail');
}

/* ===== 设置 ===== */
function openSettings(){
  $('proxy-input').value = localStorage.getItem('proxy_url')||'';
  $('key-input').value = localStorage.getItem('deepseek_key')||'';
  $('modal-settings').classList.add('show');
}
function closeSettings(){ $('modal-settings').classList.remove('show'); }
function saveSettings(){
  localStorage.setItem('deepseek_key', $('key-input').value.trim());
  localStorage.setItem('proxy_url', $('proxy-input').value.trim());
  closeSettings(); toast('已保存');
}

/* ===== DeepSeek 调用 ===== */
async function callDeepSeek(jd, resumes){
  const key = localStorage.getItem('deepseek_key')||'';
  const proxyUrl = localStorage.getItem('proxy_url')||'';
  if(!proxyUrl && !key) return null;
  const prompt = buildPrompt(jd, resumes);
  const payload = {
    model:'deepseek-chat',
    messages:[
      {role:'system',content:'你是资深招聘顾问。只返回JSON，不要任何其他文字。'},
      {role:'user',content:prompt}
    ],
    temperature:0.3,
    response_format:{type:'json_object'}
  };
  let url, headers;
  if(proxyUrl){
    url = proxyUrl;
    headers = {'Content-Type':'application/json'};
  } else {
    url = 'https://api.deepseek.com/chat/completions';
    headers = {'Content-Type':'application/json','Authorization':'Bearer '+key};
  }
  const resp = await fetch(url, {method:'POST', headers, body: JSON.stringify(payload)});
  if(!resp.ok) throw new Error('api '+resp.status);
  const data = await resp.json();
  const content = data.choices[0].message.content;
  const parsed = JSON.parse(content);
  const arr = Array.isArray(parsed) ? parsed : (parsed.results || []);
  return arr;
}
function buildPrompt(jd, resumes){
  const resumeBlock = resumes.map((r,i)=>(i+1)+'. '+r.name+'：\n'+r.text).join('\n\n');
  return '请为以下岗位JD评估候选人的技能匹配度。\n\n【岗位JD】\n'+jd+'\n\n【候选人简历】\n'+resumeBlock+'\n\n请返回JSON对象，格式：{"results":[{"name":"姓名","score":85,"covered":["已具备技能"],"missing":["缺失技能"],"comment":"一句话中文点评（优势+缺口+建议）"}]}\n评分标准：综合技能覆盖度和相关经验。comment要口语化，像HR说的话。';
}

/* ===== 演示模式（mock，通用岗位） ===== */
function extractKeywords(text){
  const parts = text.split(/[\s,，。；;、:：/\\|()（）\[\]【】<>《》"“”'‘’\-—\n]+/)
    .map(s=>s.trim())
    .filter(s=>s.length>=2 && s.length<=12)
    .filter(s=>!/^\d+$/.test(s));
  return [...new Set(parts)].slice(0,20);
}
function mockScore(resume, jdText){
  const tokens = extractKeywords(jdText);
  const covered = tokens.filter(t=>resume.text.includes(t));
  const missing = tokens.filter(t=>!resume.text.includes(t));
  const ratio = tokens.length ? covered.length/tokens.length : 0;
  let score = Math.round(ratio*100);
  if(resume.text.length>300) score += 5;
  if(resume.text.length<80) score -= 15;
  score = Math.min(98, Math.max(20, score));
  let comment = '';
  const strong = covered.slice(0,2).join('、');
  if(strong) comment += '命中'+strong+'等关键词';
  if(missing.length) comment += '，缺'+missing.slice(0,2).join('、');
  comment += '，匹配度'+score+'%。';
  return { name: resume.name, score, covered, missing, comment };
}

/* ===== 粘贴截图（Ctrl+V） ===== */
document.addEventListener('paste', function(e){
  const active = document.activeElement;
  if(!active || active.id !== 'resume-input') return;
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const it of items){
    if(it.type && it.type.indexOf('image')===0){
      const file = it.getAsFile();
      if(file){ e.preventDefault(); handleFiles([file]); }
      return;
    }
  }
});
